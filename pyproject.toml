[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "detection-model-soup"
version = "0.1.0"
description = "Component-specific model soups for YOLOF object detection – Master's thesis experiments"
requires-python = ">=3.9"
readme = "README.md"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
where = ["."]
include = ["soup*", "shared*", "rq1_component_soup*", "rq2_loss_landscape*", "rq3_coeff_strategy*", "rq4_cross_family*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
